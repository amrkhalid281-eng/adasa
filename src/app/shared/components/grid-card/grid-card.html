<article
  class="group h-full transform overflow-hidden rounded-3xl border border-[#262626] bg-[#161616] duration-200 hover:-translate-y-1"
>
  <a class="block flex h-full flex-col justify-between" [routerLink]="['/article',gridCardData.id]">
    <div class="relative h-52 overflow-hidden">
      <img
        [alt]="gridCardData.title"
        class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
        [src]="gridCardData.image"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
      ></div>
      <div class="absolute top-4 right-4">
        <span
          class="rounded-full border border-[#333333] bg-[#0a0a0a]/80 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm"
        >
          {{ gridCardData.category }}
        </span>
      </div>
    </div>
    <div class="p-6">
      <div class="mb-3 flex items-center gap-3 text-sm text-neutral-500">
        <span class="flex items-center gap-1">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          {{ gridCardData.readTime }}
        </span>
        <span class="h-1 w-1 rounded-full bg-neutral-600"></span>
        <span>{{ gridCardData.date }}</span>
      </div>
      <h3
        class="mb-3 line-clamp-2 text-xl leading-tight font-bold text-white transition-colors duration-300 group-hover:text-orange-500"
      >
        {{ gridCardData.title }}
      </h3>
      <p class="mb-5 line-clamp-2 text-sm leading-relaxed text-neutral-400">
        {{ gridCardData.excerpt }}
      </p>
      <div class="flex items-center justify-between border-t border-[#262626] pt-4">
        <div class="flex items-center gap-3">
          <img
            [alt]="gridCardData.author.name"
            class="h-9 w-9 rounded-full object-cover ring-2 ring-[#262626]"
            [src]="gridCardData.author.avatar"
          />
          <div>
            <p class="text-sm font-medium text-white">{{ gridCardData.author.name }}</p>
            <p class="text-xs text-neutral-500">{{ gridCardData.author.role }}</p>
          </div>
        </div>
        <div
          class="flex h-8 w-8 items-center justify-center rounded-full border border-orange-500/20 bg-orange-500/10 transition-colors duration-300 group-hover:border-transparent group-hover:bg-orange-500"
        >
          <svg
            class="h-4 w-4 rotate-180 text-orange-500 transition-colors duration-300 group-hover:text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </div>
      </div>
    </div>
  </a>
</article>
