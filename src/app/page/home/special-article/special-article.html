<section class="relative overflow-hidden bg-[#0a0a0a] py-24">
  <div
    class="absolute top-0 right-0 h-full w-1/3 bg-gradient-to-l from-orange-500/5 to-transparent"
  ></div>
  <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-12 flex flex-col items-start justify-between gap-4 md:flex-row md:items-end">
      <div>
        <div class="inline-flex items-center gap-2 mb-8 py-2 px-4 rounded-4xl bg-orange-500/10 border border-orange-500/20">
        <span class="relative inline-flex rounded-full animate-pulse h-1.5 w-1.5 bg-orange-500"></span>
        <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-500 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
        </span>
        <span class="text-sm font-medium text-orange-500 ms-1.5">مميز</span>
      </div>
        <h2 class="pb-2 text-white text-5xl font-bold">مقالات مختارة</h2>
        <p class="text-neutral-400 text-lg mx-auto max-w-lg">محتوى منتقى لبدء رحلة تعلمك</p>
      </div>
      <a
        class="group inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 px-5 py-2.5 font-medium text-white transition-all duration-300 hover:-translate-y-0.5"
        routerLink="/blog"
        data-discover="true"
      >
        عرض الكل
        <svg
          class="h-4 w-4 rotate-180 transition-transform group-hover:-translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </a>
    </div>
    <div class="space-y-8">
      @for (item of dataArticle.slice(0,3); track $index) {
        <article
          class="group relative overflow-hidden rounded-3xl border border-[#262626] bg-[#161616] transition-all duration-500 hover:border-orange-500/30"
        >
          <a class="block" [routerLink]="['/article',item.id]">
            <div class="grid gap-0 md:grid-cols-2">
              <div class="relative h-72 overflow-hidden md:h-[400px]">
                <img
                  [alt]="item.title"
                  class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
                  [src]="item.image"
                />
                <div
                  class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
                ></div>
                <div class="absolute top-4 right-4">
                  <span
                    class="inline-flex items-center gap-1.5 rounded-full bg-gradient-to-r from-orange-500 to-yellow-500 px-3 py-1.5 text-xs font-semibold text-white"
                  >
                    <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20">
                      <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                      ></path>
                    </svg>
                    مميز
                  </span>
                </div>
              </div>
              <div class="flex flex-col justify-center bg-[#161616] p-8 md:p-10">
                <div class="mb-4 flex items-center gap-3">
                  <span
                    class="rounded-full border border-orange-500/20 bg-orange-500/10 px-3 py-1 text-xs font-semibold text-orange-500"
                  >
                    {{item.category}}
                  </span>
                  <span class="flex items-center gap-1 text-sm text-neutral-500">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                      ></path>
                    </svg>
                    {{item.readTime}}
                  </span>
                </div>
                <h2
                  class="mb-4 text-2xl leading-tight font-bold text-white transition-colors duration-300 group-hover:text-orange-500 md:text-3xl"
                >
                  {{item.title}}
                </h2>
                <p class="mb-6 line-clamp-3 leading-relaxed text-neutral-400">
                  {{item.excerpt}}
                </p>
                <div class="mt-auto flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="relative">
                      <img
                        [alt]="item.author.name"
                        class="h-12 w-12 rounded-full object-cover shadow-md ring-2 ring-[#262626]"
                        [src]="item.author.avatar"
                      />
                      <div
                        class="absolute -bottom-1 -left-1 h-4 w-4 rounded-full border-2 border-[#161616] bg-orange-500"
                      ></div>
                    </div>
                    <div>
                      <p class="text-sm font-semibold text-white">{{item.author.name}}</p>
                      <p class="text-xs text-neutral-500">{{item.author.role}}</p>
                    </div>
                  </div>
                  <span
                    class="inline-flex items-center gap-2 text-sm font-semibold text-orange-500 transition-all duration-300 group-hover:gap-3"
                  >
                    اقرأ المقال
                    <svg
                      class="h-5 w-5 rotate-180"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M17 8l4 4m0 0l-4 4m4-4H3"
                      ></path>
                    </svg>
                  </span>
                </div>
              </div>
            </div>
          </a>
        </article>
      }
    </div>
  </div>
</section>
