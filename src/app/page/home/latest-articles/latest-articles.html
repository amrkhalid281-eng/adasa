<section class="relative overflow-hidden bg-[#0a0a0a] py-24">
  <div
    class="absolute bottom-0 left-0 h-full w-1/3 bg-gradient-to-r from-orange-500/5 to-transparent"
  ></div>
  <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-12 flex flex-col items-start justify-between gap-4 md:flex-row md:items-end">
      <div>
        <div class="inline-flex items-center gap-2 mb-8 py-2 px-4 rounded-4xl bg-orange-500/10 border border-orange-500/20">
          <span class="relative inline-flex rounded-full animate-pulse h-1.5 w-1.5 bg-orange-500"></span>
          <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-500 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
          </span>
          <span class="text-sm font-medium text-orange-500 ms-1.5">ألاحدث</span>
        </div>
        <h2 class="text-5xl pb-7 font-extrabold text-white">أحدث المقالات</h2>
        <p class=" text-neutral-400 max-w-lg text-lg font-bold"> جديد طازج من المطبعة</p>
      </div>
      <a
        class="group inline-flex items-center gap-2 font-semibold text-orange-500 transition-colors hover:text-orange-400"
        routerLink="/blog"
      >
        عرض جميع المقالات
        <svg
          class="h-5 w-5 rotate-180 transition-transform group-hover:-translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 8l4 4m0 0l-4 4m4-4H3"
          ></path>
        </svg>
      </a>
    </div>
    <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
      @for (item of latestPosts; track $index) {
        <article class="group h-full transform overflow-hidden rounded-3xl border border-[#262626] bg-[#161616] duration-200 hover:-translate-y-1">
          <a class="block" [routerLink]="['/article' , item.id]">
            <div class="relative h-52 overflow-hidden">
              <img
                [alt]="item.title"
                class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
                [src]="item.image"
              />
              <div
                class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
              ></div>
              <div class="absolute top-4 right-4">
                <span
                  class="rounded-full border border-[#333333] bg-[#0a0a0a]/80 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm"
                >
                  {{item.category}}
                </span>
              </div>
            </div>
            <div class="p-6">
              <div class="mb-3 flex items-center gap-3 text-sm text-neutral-500">
                <span class="flex items-center gap-1">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    ></path>
                  </svg>
                  {{item.readTime}}
                </span>
                <span class="h-1 w-1 rounded-full bg-neutral-600"></span>
                <span>{{item.date}}</span>
              </div>
              <h3
                class="mb-3 line-clamp-2 text-xl leading-tight font-bold text-white transition-colors duration-300 group-hover:text-orange-500"
              >
                {{item.title}}
              </h3>
              <p class="mb-5 line-clamp-2 text-sm leading-relaxed text-neutral-400">
                {{item.excerpt}}
              </p>
              <div class="flex items-center justify-between border-t border-[#262626] pt-4">
                <div class="flex items-center gap-3">
                  <img
                    [alt]="item.author.name"
                    class="h-9 w-9 rounded-full object-cover ring-2 ring-[#262626]"
                    [src]="item.author.avatar"
                  />
                  <div>
                    <p class="text-sm font-medium text-white">{{item.author.name}}</p>
                    <p class="text-xs text-neutral-500">{{item.author.role}}</p>
                  </div>
                </div>
                <div
                  class="flex h-8 w-8 items-center justify-center rounded-full border border-orange-500/20 bg-orange-500/10 transition-colors duration-300 group-hover:border-transparent group-hover:bg-orange-500"
                >
                  <svg
                    class="h-4 w-4 rotate-180 text-orange-500 transition-colors duration-300 group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
          </a>
        </article>
      }
    </div>
  </div>
</section>
